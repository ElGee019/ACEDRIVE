name: ci
on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build ACEDRIVE.slnx --nologo
      - run: dotnet test ACEDRIVE.slnx --no-build --nologo
      - run: dotnet format ACEDRIVE.slnx --verify-no-changes --no-restore
